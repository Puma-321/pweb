<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 09 - Extra</title>
    <style type="text/css">
        body {
            margin: 0;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: lightblue;
            text-align: center;
        }

        .linha {
            display: flex;
            margin-top: 30px;
        }

        .left {
            width: 25%;
            background-color: lightcoral;
            text-align: center;
        }

        .center {
            width: 50%;
            background-color: lightgreen;
            text-align: center;
        }

        .right {
            width: 25%;
            background-color: lightcoral;
            text-align: center;
        }

        .footer {
            width: 100%;
            background-color: lightpink;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">Header 100%</div>

    <div class="linha">
        <div class="left">Left 25%</div>
        <div class="center">Center 50%</div>
        <div class="right">Right 25%</div>
    </div>

    <div class="footer">Footer 100%</div>

    <p><a href="index.html">voltar</a></p>

</body>
</html>
