<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        
  <div>
    <label for="login">Login:</label><br>
    <input type="text" id="login" name="login" required>
  </div>

  <div>
    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha" required>
  </div>

  <div>
    <label for="confirmarSenha">Confirmar senha:</label><br>
    <input type="password" id="confirmarSenha" name="confirmarSenha" required>
  </div>

  <div>
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome">
  </div>

  <fieldset>
    <legend>Sexo:</legend>
    <label>
      <input type="radio" name="sexo" value="Masculino" required>
      Masculino
    </label>
    <label>
      <input type="radio" name="sexo" value="Feminino">
      Feminino
    </label>
  </fieldset>

  <div>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email">
  </div>

  <fieldset>
    <legend>Interesses:</legend>
    <label><input type="checkbox" name="interesses" value="Futebol"> Futebol</label>
    <label><input type="checkbox" name="interesses" value="Politica"> Política</label>
    <label><input type="checkbox" name="interesses" value="Economia"> Economia</label>
    <label><input type="checkbox" name="interesses" value="Carros"> Carros</label>
    <label><input type="checkbox" name="interesses" value="Celebridades"> Celebridades</label>
  </fieldset>

  <div>
    <button type="submit">Enviar</button>
  </div>

  <label for="estado">selecione um estado:</label>

  <select name="estado" id="estado">
  <option value="sp">sp</option>
  <option value="pi">pi</option>
  <option value="ma">ma</option>
  <option value="pa">pa</option>
  </select>

  <div>

<label for="observações">Observações:</label>

<textarea id="observações" name="observações" rows="4" cols="50">
</textarea>

 </div>

    </form>
</body>
</html>
