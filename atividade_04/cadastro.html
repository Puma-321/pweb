<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="https://qfqdkj.hospedagemelastica.com.br/pweb/salvar.jsp" method="POST">
        
  <div>
    <label for="login">Login:</label><br>
    <input type="text" id="login" name="login" required>
  </div>

  <div>
    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha" required>
  </div>

  <div>
    <label for="confirmarSenha">Confirmar senha:</label><br>
    <input type="password" id="confirmarSenha" name="confirmarSenha" required>
  </div>

  <div>
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome">
  </div>

  <fieldset>
    <legend>Sexo:</legend>
    <label>
      <input type="radio" name="sexo" value="Masculino" required>
      Masculino
    </label>
    <label>
      <input type="radio" name="sexo" value="Feminino">
      Feminino
    </label>
  </fieldset>

  <div>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email">
  </div>

  <fieldset>
    <legend>Interesses:</legend>
    <label><input type="checkbox" name="interesses" value="Futebol"> Futebol</label>
    <label><input type="checkbox" name="interesses" value="Politica"> Política</label>
    <label><input type="checkbox" name="interesses" value="Economia"> Economia</label>
    <label><input type="checkbox" name="interesses" value="Carros"> Carros</label>
    <label><input type="checkbox" name="interesses" value="Celebridades"> Celebridades</label>
  </fieldset>

  <div>

  <label for="estado">selecione um estado:</label>

  <select name="estado" id="estado">
  <option value="sp">São Paulo</option>
  <option value="pi">Piauí</option>
  <option value="ma">Maranhão</option>
  <option value="pa">Pará</option>
  <option value="ac">Acre</option>
  <option value="al">Alagoas</option>
  <option value="ap">Amapá</option>
  <option value="am">Amazonas</option>
  <option value="ba">Bahia</option>
  <option value="ce">Ceará</option>
  <option value="df">Distrito Federal</option>
  <option value="es">Espírito Santo</option>
  <option value="go">Goiás</option>
  <option value="mt">Mato Grosso</option>
  <option value="ms">Mato Grosso do Sul</option>
  <option value="mg">Minas Gerais</option>
  <option value="pb">Paraíba</option>
  <option value="pr">Paraná</option>
  <option value="pe">Pernambuco</option>
  <option value="rj">Rio de Janeiro</option>
  <option value="rn">Rio Grande do Norte</option>
  <option value="rs">Rio Grande do Sul</option>
  <option value="ro">Rondônia</option>
  <option value="rr">Roraima</option>
  <option value="sc">Santa Catarina</option>
  <option value="se">Sergipe</option>
  <option value="to">Tocantins</option>
</select>

</div>

 <label for="observacoes">Observações:</label>

<textarea id="observacoes" name="observacoes" rows="4" cols="50">
</textarea>

 <div>

  <button type="submit">Enviar</button>

 </div>

</form>
</body>
</html>
