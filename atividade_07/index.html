<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 07</title>
    <style type="text/css">
        .serif {
            font-family: "Times New Roman", Times, serif;
        }

        .sans-serif {
            font-family: Arial, Helvetica, sans-serif;
        }

        .monospace {
            font-family: "Courier New", Courier, monospace;
        }

        .cursive {
            font-family: "Brush Script MT", cursive;
        }

        .fantasy {
            font-family: Copperplate, Papyrus, fantasy;
        }
    </style>
</head>
<body>

    <h1>Atividade 07 - Famílias de Fontes</h1>

    <p class="serif">Texto com fonte Serif.</p>

    <p class="sans-serif">Texto com fonte Sans-serif.</p>

    <p class="monospace">Texto com fonte Monospace.</p>

    <p class="cursive">Texto com fonte Cursive.</p>

    <p class="fantasy">Texto com fonte Fantasy.</p>

    <hr>

    <h1>Font Style</h1>

    <p class="serif" style="font-style: normal;">Estilo normal.</p>
    <p class="serif" style="font-style: italic;">Estilo itálico.</p>
    <p class="serif" style="font-style: oblique;">Estilo oblíquo.</p>

</body>
</html>
