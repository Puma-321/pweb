<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 07</title>
    <style type="text/css">
        .fonteSerif {
            font-family: "Times New Roman";
            font-size: 80px;
        }

        .fonteSans-Serif {
            font-family: "Verdana";
            font-size: 40px;
        }

        .fonteMonospace {
            font-family: "Courier New";
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Atividade 07 - Famílias de Fontes</h1>

    <p class="fonteSerif">Texto com fonteSerif</p>

    <p class="fonteSans-Serif">Texto com fonteSans-Serif</p>

    <p class="fonteMonospace">Texto com fonteMonospace</p>

</body>
</html>
